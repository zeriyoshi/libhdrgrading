<rect class="hd-box" x="250" y="648" width="250" height="46" rx="7"/>
<text class="hd-label" x="375.0" y="668.0" text-anchor="middle">Output rows</text>
<text class="hd-sub" x="375.0" y="683.0" text-anchor="middle">container or session</text>
</g>
