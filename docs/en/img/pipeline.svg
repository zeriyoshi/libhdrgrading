<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" width="1040" height="740" class="hd-svg" role="img" aria-labelledby="pipeline-title" lang="en">
<title id="pipeline-title">One frame through the pipeline: analysis, plan, render, apply</title>
<desc>A frame is read three times from its code values: pass A analyzes it, pass B plans the gain on cells, the render fits the plan to the display, pass C applies it in bands.</desc>
<style>
