<rect class="hd-box" x="250" y="192" width="250" height="46" rx="7"/>
<text class="hd-label" x="375.0" y="212.0" text-anchor="middle">PREFILTER stage (optional)</text>
<text class="hd-sub hd-mono" x="375.0" y="227.0" text-anchor="middle">host/stage · plugins/</text>
</g>
<g class="hd-k-core">
<rect class="hd-box" x="250" y="268" width="250" height="46" rx="7"/>
<text class="hd-label" x="375.0" y="288.0" text-anchor="middle">Pass A: analysis</text>
<text class="hd-sub hd-mono" x="375.0" y="303.0" text-anchor="middle">core/analyze · ANALYZE stage</text>
</g>
<g class="hd-k-core">
<rect class="hd-box" x="250" y="344" width="250" height="46" rx="7"/>
