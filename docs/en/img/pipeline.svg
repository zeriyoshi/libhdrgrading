<rect class="hd-box" x="30" y="306" width="180" height="46" rx="7"/>
<text class="hd-label" x="120.0" y="326.0" text-anchor="middle">hdrg_params_t</text>
<text class="hd-sub" x="120.0" y="341.0" text-anchor="middle">content intent</text>
</g>
<g class="hd-k-api">
<rect class="hd-box" x="30" y="420" width="180" height="46" rx="7"/>
<text class="hd-label" x="120.0" y="440.0" text-anchor="middle">hdrg_display_caps_t</text>
<text class="hd-sub" x="120.0" y="455.0" text-anchor="middle">what the display shows</text>
</g>
<g class="hd-k-core">
<rect class="hd-box" x="30" y="572" width="180" height="46" rx="7"/>
<text class="hd-label" x="120.0" y="592.0" text-anchor="middle">Color LUT</text>
<text class="hd-sub" x="120.0" y="607.0" text-anchor="middle">core/color: Oklab gamut map</text>
</g>
<text class="hd-note" x="530" y="59" text-anchor="start">The caller&#x27;s pixels stay as code values; each pass decodes them on the fly</text>
<text class="hd-note" x="530" y="74" text-anchor="start">through per-channel EOTF tables (no full-resolution float planes).</text>
<text class="hd-note" x="530" y="135" text-anchor="start">16 × 16 tiles (Immerkær): the Y&#x27; noise by level, Cb / Cr, blockiness, ringing.</text>
<text class="hd-note" x="530" y="150" text-anchor="start">Given to the filters as HDRG_SD_NOISE; measured again after the chain for pass C.</text>
<text class="hd-note" x="530" y="211" text-anchor="start">Built-in chain deblock → dering → defringe → deband → MCTF (sessions) → NR,</text>
<text class="hd-note" x="530" y="226" text-anchor="start">or up to 6 filters added; skipped when every filter passes the frame through.</text>
<text class="hd-note" x="530" y="287" text-anchor="start">La = max(Y, 0.7 · maxRGB); histogram → p99.5 and key; 4 × 4 cells (2 × 2 under</text>
<text class="hd-note" x="530" y="302" text-anchor="start">QUALITY). Lights: bright components, rings, an even falloff → boost share;</text>
<text class="hd-note" x="530" y="317" text-anchor="start">the ANALYZE stage (light_predictor &gt; 0) may lower a doubtful light&#x27;s boost.</text>
<text class="hd-note" x="530" y="363" text-anchor="start">Diffuse level from the key; the boost share on a bilateral grid (8 × 8 cells ×</text>
<text class="hd-note" x="530" y="378" text-anchor="start">24 log2 La bins); clarity base; APL cell statistics. Display independent.</text>
<text class="hd-note" x="530" y="439" text-anchor="start">hdrg_display_caps_t → diffuse multiplier, boost span up to the peak, APL budget</text>
<text class="hd-note" x="530" y="454" text-anchor="start">factor (binary search), shoulder peak, gamut, encoding. Re-rendered per display.</text>
<text class="hd-note" x="530" y="515" text-anchor="start">A different output size or a filter on the stage: the filter, else a built-in</text>
<text class="hd-note" x="530" y="530" text-anchor="start">scaler (Lanczos; the upscaler when no side shrinks). Analysis and plan stay as input.</text>
<text class="hd-note" x="530" y="591" text-anchor="start">256-row bands in parallel, 16-pixel blocks: g = diffuse + h · span + contrast +</text>
<text class="hd-note" x="530" y="606" text-anchor="start">clarity; color LUT (33³) × 2^g; shoulder; PQ, or SDR + gain-map sums; grain.</text>
<text class="hd-note" x="530" y="667" text-anchor="start">8 / 16-bit rows to the writer (JPEG, JPEG XL, AVIF, HEIF), or the session&#x27;s PQ</text>
<text class="hd-note" x="530" y="682" text-anchor="start">R&#x27;G&#x27;B&#x27; / 4:2:0; the light measured on the way gives MaxCLL / FALL, HDR10+ and</text>
<text class="hd-note" x="530" y="697" text-anchor="start">ST 2094-50.</text>
<text class="hd-note" x="30" y="186" text-anchor="start">dashed: the estimate,</text>
<text class="hd-note" x="30" y="201" text-anchor="start">again after the chain,</text>
<text class="hd-note" x="30" y="216" text-anchor="start">cores pass C</text>
</svg>
