<g class="hd-k-data">
<rect class="hd-box" x="250" y="40" width="250" height="46" rx="7"/>
<text class="hd-label" x="375.0" y="60.0" text-anchor="middle">Frame (code values)</text>
<text class="hd-sub hd-mono" x="375.0" y="75.0" text-anchor="middle">core/image: EOTF LUT</text>
</g>
<g class="hd-k-core">
<rect class="hd-box" x="250" y="116" width="250" height="46" rx="7"/>
<text class="hd-label" x="375.0" y="136.0" text-anchor="middle">Noise estimate</text>
<text class="hd-sub hd-mono" x="375.0" y="151.0" text-anchor="middle">core/noise</text>
</g>
