<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" class="hd-svg" role="img" aria-labelledby="bindings-title" lang="en">
<title id="bindings-title">Bindings: media frameworks on top of the public API</title>
<desc>Each framework binding maps its frames, colors and metadata to a session; the browser module converts stills.</desc>
