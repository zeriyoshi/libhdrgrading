<g class="hd-k-app">
<rect class="hd-box" x="30.0" y="40" width="245.0" height="50" rx="7"/>
<text class="hd-label" x="152.5" y="62.0" text-anchor="middle">FFmpeg</text>
<text class="hd-sub" x="152.5" y="77.0" text-anchor="middle">libavfilter, hdrg-ffmpeg</text>
</g>
<g class="hd-k-app">
<rect class="hd-box" x="295.0" y="40" width="245.0" height="50" rx="7"/>
<text class="hd-label" x="417.5" y="62.0" text-anchor="middle">GStreamer</text>
<text class="hd-sub" x="417.5" y="77.0" text-anchor="middle">1.20 or later</text>
</g>
<g class="hd-k-app">
<rect class="hd-box" x="560.0" y="40" width="245.0" height="50" rx="7"/>
<text class="hd-label" x="682.5" y="62.0" text-anchor="middle">VapourSynth</text>
<text class="hd-sub" x="682.5" y="77.0" text-anchor="middle">R81 (VapourSynth4.h)</text>
</g>
<g class="hd-k-app">
<rect class="hd-box" x="825.0" y="40" width="245.0" height="50" rx="7"/>
<text class="hd-label" x="947.5" y="62.0" text-anchor="middle">Browser</text>
<text class="hd-sub" x="947.5" y="77.0" text-anchor="middle">Emscripten, WebGPU</text>
</g>
<g class="hd-k-entry">
<rect class="hd-box" x="30.0" y="130" width="245.0" height="96" rx="7"/>
<text class="hd-label" x="152.5" y="161.0" text-anchor="middle">src/bindings/ffmpeg</text>
<text class="hd-sub" x="152.5" y="176.0" text-anchor="middle">patches/: vf_libhdrgrading.c</text>
<text class="hd-sub" x="152.5" y="190.0" text-anchor="middle">(tools/ffmpeg: AVFrame ↔ session,</text>
<text class="hd-sub" x="152.5" y="204.0" text-anchor="middle">zero copy, film grain, VideoToolbox)</text>
</g>
<g class="hd-k-entry">
<rect class="hd-box" x="295.0" y="130" width="245.0" height="96" rx="7"/>
<text class="hd-label" x="417.5" y="161.0" text-anchor="middle">src/bindings/gstreamer</text>
<text class="hd-sub" x="417.5" y="176.0" text-anchor="middle">element hdrgrade: caps colorimetry,</text>
<text class="hd-sub" x="417.5" y="190.0" text-anchor="middle">latency = future window,</text>
<text class="hd-sub" x="417.5" y="204.0" text-anchor="middle">HdrgDynamicHdrMeta</text>
</g>
<g class="hd-k-entry">
<rect class="hd-box" x="560.0" y="130" width="245.0" height="96" rx="7"/>
<text class="hd-label" x="682.5" y="161.0" text-anchor="middle">src/bindings/vapoursynth</text>
<text class="hd-sub" x="682.5" y="176.0" text-anchor="middle">hdrg.Grade: any order, parallel;</text>
<text class="hd-sub" x="682.5" y="190.0" text-anchor="middle">seeks with the preroll;</text>
<text class="hd-sub" x="682.5" y="204.0" text-anchor="middle">frame props HDR10Plus</text>
</g>
<g class="hd-k-entry">
<rect class="hd-box" x="825.0" y="130" width="245.0" height="96" rx="7"/>
<text class="hd-label" x="947.5" y="161.0" text-anchor="middle">src/wasm</text>
<text class="hd-sub" x="947.5" y="176.0" text-anchor="middle">hdrg_wasm_*: settings by name,</text>
<text class="hd-sub" x="947.5" y="190.0" text-anchor="middle">convert (JSPI Promise),</text>
<text class="hd-sub" x="947.5" y="204.0" text-anchor="middle">interactive preview state</text>
</g>
<g class="hd-k-api">
<rect class="hd-box" x="30" y="270" width="1040" height="64" rx="7"/>
<text class="hd-label" x="550.0" y="299.0" text-anchor="middle">Public API</text>
<text class="hd-sub hd-mono" x="550.0" y="314.0" text-anchor="middle">video.h: hdrg_session_*    metadata.h: hdrg_hdr10plus_t35 · hdrg_st2094_50_t35    hdrgrading.h: hdrg_setting_* · hdrg_convert</text>
</g>
<text class="hd-note" x="30" y="366" text-anchor="start">Settings take the hdrg-cli option names (hdrg_setting_at / set / get; VapourSynth: _ for -) and numbers; the own preset / temporal / latency options take value names.</text>
<text class="hd-note" x="30" y="388" text-anchor="start">The video bindings give single-layer PQ (BT.2020; VapourSynth&#x27;s rgb48 Display P3 unless bt2020=1)</text>
<text class="hd-note" x="30" y="403" text-anchor="start">with the mastering display (hdrg_session_peak) and per-frame HDR10+ and ST 2094-50 as T.35 payloads.</text>
<text class="hd-note" x="30" y="425" text-anchor="start">The framework bindings use the public headers alone and link libhdrgrading (the FFmpeg filter the shared library</text>
<text class="hd-note" x="30" y="440" text-anchor="start">through pkg-config); the browser module also reads foundation&#x27;s memory.h.</text>
</svg>
