.hd-svg .hd-bg { fill: var(--hd-bg); }
.hd-svg text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic UI", sans-serif; fill: var(--hd-ink); }
.hd-svg .hd-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono", "DejaVu Sans Mono", monospace; }
.hd-svg .hd-label { font-size: 13px; font-weight: 600; }
