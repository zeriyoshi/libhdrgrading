<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" class="hd-svg" role="img" aria-labelledby="tools-title" lang="en">
<title id="tools-title">Tools: what each one runs and which library it links</title>
<desc>The tools use the public API; the two developer tools read internal headers and link the internal static library.</desc>
<style>
