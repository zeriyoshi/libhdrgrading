.hd-svg .hd-k-common rect.hd-box { fill: var(--hd-common-fill); stroke: var(--hd-common-stroke); stroke-width: 1.3; }
.hd-svg .hd-k-ext rect.hd-box { fill: var(--hd-ext-fill); stroke: var(--hd-ext-stroke); stroke-width: 1.3; }
.hd-svg .hd-k-data rect.hd-box { fill: var(--hd-data-fill); stroke: var(--hd-data-stroke); stroke-width: 1.3; }
.hd-svg .hd-k-ext rect.hd-box, .hd-svg .hd-k-data rect.hd-box { stroke-dasharray: 4 3; }
