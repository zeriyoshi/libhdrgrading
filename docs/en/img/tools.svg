<polyline class="hd-edge" points="338.8,112.0 338.8,154.0"/>
<polygon class="hd-arrow" points="338.8,160.0 335.3,153.0 342.3,153.0"/>
<polyline class="hd-edge" points="550.0,112.0 550.0,154.0"/>
<polygon class="hd-arrow" points="550.0,160.0 546.5,153.0 553.5,153.0"/>
<polyline class="hd-edge" points="761.2,112.0 761.2,154.0"/>
<polygon class="hd-arrow" points="761.2,160.0 757.7,153.0 764.7,153.0"/>
<polyline class="hd-edge" points="972.4,112.0 972.4,154.0"/>
<polygon class="hd-arrow" points="972.4,160.0 968.9,153.0 975.9,153.0"/>
<polyline class="hd-edge" points="286.0,326.0 286.0,368.0"/>
<polygon class="hd-arrow" points="286.0,374.0 282.5,367.0 289.5,367.0"/>
<polyline class="hd-edge" points="814.0,326.0 814.0,368.0"/>
<polygon class="hd-arrow" points="814.0,374.0 810.5,367.0 817.5,367.0"/>
<g class="hd-k-app">
<rect class="hd-box" x="30.0" y="40" width="195.2" height="72" rx="7"/>
<text class="hd-label" x="127.6" y="66.0" text-anchor="middle">hdrg-cli</text>
<text class="hd-sub" x="127.6" y="81.0" text-anchor="middle">stills: hdrg_convert,</text>
<text class="hd-sub" x="127.6" y="95.0" text-anchor="middle">every setting</text>
</g>
<g class="hd-k-app">
<rect class="hd-box" x="241.2" y="40" width="195.2" height="72" rx="7"/>
<text class="hd-label" x="338.8" y="66.0" text-anchor="middle">hdrg-video</text>
<text class="hd-sub" x="338.8" y="81.0" text-anchor="middle">y4m / raw pipes: sessions,</text>
<text class="hd-sub" x="338.8" y="95.0" text-anchor="middle">3D LUT, HDR10+ JSON</text>
</g>
<g class="hd-k-app">
<rect class="hd-box" x="452.4" y="40" width="195.2" height="72" rx="7"/>
<text class="hd-label" x="550.0" y="66.0" text-anchor="middle">hdrg-ffmpeg</text>
<text class="hd-sub" x="550.0" y="81.0" text-anchor="middle">files through FFmpeg</text>
<text class="hd-sub" x="550.0" y="95.0" text-anchor="middle">and tools/ffmpeg</text>
</g>
<g class="hd-k-app">
<rect class="hd-box" x="663.5999999999999" y="40" width="195.2" height="72" rx="7"/>
<text class="hd-label" x="761.2" y="73.0" text-anchor="middle">hdrg-inspect</text>
<text class="hd-sub" x="761.2" y="88.0" text-anchor="middle">HDR signaling check</text>
</g>
<g class="hd-k-app">
<rect class="hd-box" x="874.8" y="40" width="195.2" height="72" rx="7"/>
<text class="hd-label" x="972.4" y="59.0" text-anchor="middle">hdrg-gui</text>
<text class="hd-sub" x="972.4" y="74.0" text-anchor="middle">SDL3 + Dear ImGui,</text>
<text class="hd-sub" x="972.4" y="88.0" text-anchor="middle">the OS&#x27;s decoders and</text>
<text class="hd-sub" x="972.4" y="102.0" text-anchor="middle">encoders (not installed)</text>
</g>
<g class="hd-k-api">
<rect class="hd-box" x="30" y="160" width="1040" height="52" rx="7"/>
<text class="hd-label" x="550.0" y="183.0" text-anchor="middle">libhdrgrading</text>
<text class="hd-sub" x="550.0" y="198.0" text-anchor="middle">the public API alone (static or shared; a shared one exports the HDRG_API functions)</text>
</g>
<g class="hd-k-common">
<rect class="hd-box" x="30.0" y="262" width="512.0" height="64" rx="7"/>
<text class="hd-label" x="286.0" y="291.0" text-anchor="middle">hdrg-bench</text>
<text class="hd-sub" x="286.0" y="306.0" text-anchor="middle">tests/tools/: time of each stage</text>
</g>
<g class="hd-k-common">
<rect class="hd-box" x="558.0" y="262" width="512.0" height="64" rx="7"/>
<text class="hd-label" x="814.0" y="291.0" text-anchor="middle">hdrg-predictor-data</text>
<text class="hd-sub" x="814.0" y="306.0" text-anchor="middle">tests/tools/: the light predictor&#x27;s rows</text>
</g>
<g class="hd-k-common">
<rect class="hd-box" x="30" y="374" width="1040" height="52" rx="7"/>
<text class="hd-label" x="550.0" y="397.0" text-anchor="middle">${HDRG_INTERNAL}</text>
<text class="hd-sub" x="550.0" y="412.0" text-anchor="middle">the same objects with the internal headers (src/): the static library, or hdrgrading_internal beside a shared one</text>
</g>
<text class="hd-note" x="30" y="464" text-anchor="start">hdrg-ffmpeg is built when libavcodec / libavformat / libswscale are found; hdrg-gui with -DHDRG_BUILD_GUI=ON (FFmpeg on Linux: HDRG_GUI_MEDIA=ffmpeg).</text>
<text class="hd-note" x="30" y="484" text-anchor="start">hdrg-inspect includes the public headers alone; with the jxl family built it links ${HDRG_INTERNAL} for the bundled libjxl&#x27;s objects.</text>
<text class="hd-note" x="30" y="504" text-anchor="start">The tests and fuzz_seeds link ${HDRG_INTERNAL} too; the plugins and the bindings link the public library.</text>
</svg>
