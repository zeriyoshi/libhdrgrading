<g class="hd-k-data">
<rect class="hd-box" x="40.0" y="70" width="145.0" height="86" rx="7"/>
<text class="hd-label" x="112.5" y="103.0" text-anchor="middle">Frame</text>
<text class="hd-sub" x="112.5" y="118.0" text-anchor="middle">host planes or</text>
<text class="hd-sub" x="112.5" y="132.0" text-anchor="middle">a GPU frame</text>
</g>
<g class="hd-k-entry">
<rect class="hd-box" x="207.0" y="70" width="145.0" height="86" rx="7"/>
<text class="hd-label" x="279.5" y="103.0" text-anchor="middle">Ingest</text>
<text class="hd-sub" x="279.5" y="118.0" text-anchor="middle">Y&#x27;CbCr → RGB16</text>
<text class="hd-sub" x="279.5" y="132.0" text-anchor="middle">(CPU or GPU)</text>
</g>
