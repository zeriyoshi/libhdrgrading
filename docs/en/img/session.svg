<rect class="hd-box" x="374.0" y="70" width="145.0" height="86" rx="7"/>
<text class="hd-label" x="446.5" y="103.0" text-anchor="middle">PREFILTER chain</text>
<text class="hd-sub" x="446.5" y="118.0" text-anchor="middle">time windows,</text>
<text class="hd-sub" x="446.5" y="132.0" text-anchor="middle">ASYNC in flight</text>
</g>
<g class="hd-k-core">
<rect class="hd-box" x="541.0" y="70" width="145.0" height="86" rx="7"/>
<text class="hd-label" x="613.5" y="96.0" text-anchor="middle">Analysis</text>
<text class="hd-sub" x="613.5" y="111.0" text-anchor="middle">proxy ≤ 960 px</text>
<text class="hd-sub" x="613.5" y="125.0" text-anchor="middle">(REALTIME), noise,</text>
<text class="hd-sub" x="613.5" y="139.0" text-anchor="middle">lights</text>
</g>
<g class="hd-k-core">
<rect class="hd-box" x="708.0" y="70" width="145.0" height="86" rx="7"/>
<text class="hd-label" x="780.5" y="103.0" text-anchor="middle">Scene cut test</text>
<text class="hd-sub" x="780.5" y="118.0" text-anchor="middle">histogram + log</text>
<text class="hd-sub" x="780.5" y="132.0" text-anchor="middle">average, fades</text>
</g>
<g class="hd-k-data">
<rect class="hd-box" x="875.0" y="70" width="145.0" height="86" rx="7"/>
<text class="hd-label" x="947.5" y="103.0" text-anchor="middle">Queue</text>
<text class="hd-sub" x="947.5" y="118.0" text-anchor="middle">the queue&#x27;s depth</text>
<text class="hd-sub" x="947.5" y="132.0" text-anchor="middle">+ 1 frames</text>
</g>
<g class="hd-k-data">
<rect class="hd-box" x="40.0" y="262" width="145.0" height="100" rx="7"/>
<text class="hd-label" x="112.5" y="302.0" text-anchor="middle">Output</text>
<text class="hd-sub" x="112.5" y="317.0" text-anchor="middle">PQ R&#x27;G&#x27;B&#x27; or 4:2:0,</text>
<text class="hd-sub" x="112.5" y="331.0" text-anchor="middle">HDR10+, ST 2094-50</text>
</g>
<g class="hd-k-core">
<rect class="hd-box" x="207.0" y="262" width="145.0" height="100" rx="7"/>
<text class="hd-label" x="279.5" y="302.0" text-anchor="middle">Apply (pass C)</text>
<text class="hd-sub" x="279.5" y="317.0" text-anchor="middle">CPU kernels</text>
<text class="hd-sub" x="279.5" y="331.0" text-anchor="middle">or the GPU</text>
</g>
<g class="hd-k-filter">
<rect class="hd-box" x="374.0" y="262" width="145.0" height="100" rx="7"/>
<text class="hd-label" x="446.5" y="302.0" text-anchor="middle">SCALE / INTERP</text>
<text class="hd-sub" x="446.5" y="317.0" text-anchor="middle">output size,</text>
<text class="hd-sub" x="446.5" y="331.0" text-anchor="middle">out_rate</text>
</g>
<g class="hd-k-core">
<rect class="hd-box" x="541.0" y="262" width="145.0" height="100" rx="7"/>
<text class="hd-label" x="613.5" y="309.0" text-anchor="middle">Flash limiter</text>
<text class="hd-sub" x="613.5" y="324.0" text-anchor="middle">ITU-R BT.1702-3</text>
</g>
<g class="hd-k-core">
<rect class="hd-box" x="708.0" y="262" width="145.0" height="100" rx="7"/>
<text class="hd-label" x="780.5" y="302.0" text-anchor="middle">Plan + render</text>
<text class="hd-sub" x="780.5" y="317.0" text-anchor="middle">pass B, display</text>
<text class="hd-sub" x="780.5" y="331.0" text-anchor="middle">caps</text>
</g>
<g class="hd-k-filter">
<rect class="hd-box" x="875.0" y="262" width="145.0" height="100" rx="7"/>
<text class="hd-label" x="947.5" y="295.0" text-anchor="middle">STATS stage</text>
<text class="hd-sub" x="947.5" y="310.0" text-anchor="middle">statistics across</text>
<text class="hd-sub" x="947.5" y="324.0" text-anchor="middle">frames, fades,</text>
<text class="hd-sub" x="947.5" y="338.0" text-anchor="middle">steady lights</text>
</g>
<text class="hd-note" x="40" y="420" text-anchor="start">Latency (hdrg_session_latency): the statistics window&#x27;s future, the filters&#x27; time windows&#x27; future and their ASYNC frames in flight; LOW waits for each job.</text>
<text class="hd-note" x="40" y="440" text-anchor="start">Seeking: start = n − p, preroll = p (hdrg_session_preroll) renders frame n byte for byte as a session from the first frame (WINDOWED, TWO_PASS, STATIC).</text>
<text class="hd-note" x="40" y="460" text-anchor="start">Frames on the GPU (HDRG_GPU_AUTO, Y&#x27;CbCr input, the library&#x27;s GPU filters alone, no SCALE): ingest to apply stay on the device; the analysis reads back a proxy and noise windows.</text>
<text class="hd-note" x="40" y="480" text-anchor="start">Each receive also reports late (the rate is not kept), shed, synthetic / phase (out_rate) and the motion fields; hdrg_session_latency_report says what to change.</text>
<text class="hd-note" x="40" y="510" text-anchor="start">A session is used by one thread at a time: send until HDRG_ERR_AGAIN, receive until HDRG_ERR_AGAIN, …; send NULL at the end, then receive until HDRG_EOF.</text>
</svg>
