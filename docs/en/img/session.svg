<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 530" width="1060" height="530" class="hd-svg" role="img" aria-labelledby="session-title" lang="en">
<title id="session-title">A video session: send_frame and receive_frame</title>
<desc>Sent frames are converted, prefiltered, analyzed and queued; received frames take their scene&#x27;s statistics, are planned, limited, scaled and applied.</desc>
