<text class="hd-note" x="368" y="336" text-anchor="start">ICC: 行列 + TRC は直接読み、</text>
<text class="hd-note" x="368" y="351" text-anchor="start">LUT 型は lcms2 で</text>
<text class="hd-note" x="20" y="482" text-anchor="start">静止画のファイルは想定の視聴 (hdrg_container_caps: 白 203 nits、ゲインマップは 3 段の上限、Display P3 (JPEG は lcms2 があるとき)) へ描く。effort は QUALITY、粒は PRESERVE。</text>
<text class="hd-note" x="20" y="500" text-anchor="start">output_mode の AUTO は書き手の既定の形 (JPEG・AVIF・HEIF は GAINMAP、JPEG XL は HYBRID)。既定の書き手は hdrg.jpeg。</text>
<text class="hd-note" x="20" y="518" text-anchor="start">出力のバッファはアロケータを持つので、コンテキストを壊した後も hdrg_free で解放できる。</text>
</svg>
