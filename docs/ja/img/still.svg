<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" width="1060" height="540" class="hd-svg" role="img" aria-labelledby="still-title" lang="ja">
<title id="still-title">静止画の変換: hdrg_convert がバイト列から HDR のファイルを作る</title>
<desc>色を解決して復号し、向きを正して pipeline を通し、3 つの形のどれかをコンテキストの書き手 (コーデックのプラグイン) で書く。</desc>
