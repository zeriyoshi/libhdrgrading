<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" width="1040" height="740" class="hd-svg" role="img" aria-labelledby="pipeline-title" lang="ja">
<title id="pipeline-title">1 枚のフレームがパイプラインを通る流れ: 解析・プラン・描画・適用</title>
<desc>フレームは符号値から 3 回読まれる。走査 A が解析し、走査 B がセルの上にゲインを計画し、描画がプランを表示に合わせ、走査 C が帯ごとに適用する。</desc>
