<text class="hd-note" x="530" y="59" text-anchor="start">呼び出し元の画素は符号値のまま。走査のたびにチャネルごとの EOTF の表で</text>
<text class="hd-note" x="530" y="74" text-anchor="start">その場で復号する (全解像度の float の面を持たない)。</text>
<text class="hd-note" x="530" y="135" text-anchor="start">16 × 16 のタイル (Immerkær 法): 水準ごとの Y&#x27; のノイズ・Cb / Cr・ブロック性・</text>
<text class="hd-note" x="530" y="150" text-anchor="start">リンギング。フィルタへ HDRG_SD_NOISE で渡す。連鎖の後で測り直して走査 C に使う。</text>
<text class="hd-note" x="530" y="211" text-anchor="start">内蔵の連鎖 deblock → dering → defringe → deband → MCTF (セッション) → NR、</text>
<text class="hd-note" x="530" y="226" text-anchor="start">または追加した 6 つまでのフィルタ。どれも素通しなら段ごと飛ばす。</text>
<text class="hd-note" x="530" y="287" text-anchor="start">La = max(Y, 0.7 × 最大チャネル)。ヒストグラム → p99.5 と key。4 × 4 のセル</text>
<text class="hd-note" x="530" y="302" text-anchor="start">(QUALITY は 2 × 2)。光: 明るい成分 → 輪 → どの向きにも同じ落ち方 → 上乗せの割合。</text>
<text class="hd-note" x="530" y="317" text-anchor="start">ANALYZE の段 (light_predictor &gt; 0) が疑わしい光の上乗せを下げることがある。</text>
<text class="hd-note" x="530" y="363" text-anchor="start">key から拡散面の倍率。上乗せの割合を bilateral grid (8 × 8 のセル × log2 La の</text>
<text class="hd-note" x="530" y="378" text-anchor="start">24 区分) に。clarity の基底、APL のセル統計。表示には依存しない。</text>
<text class="hd-note" x="530" y="439" text-anchor="start">hdrg_display_caps_t → 拡散面の倍率・ピークまでの上乗せの幅・APL の係数 (二分探索)・</text>
<text class="hd-note" x="530" y="454" text-anchor="start">肩のピーク・色域・符号化。表示を変えるときは描画だけを作り直す。</text>
<text class="hd-note" x="530" y="515" text-anchor="start">出力の寸法が違うか段にフィルタがあるとき: そのフィルタ、なければ内蔵の scaler</text>
<text class="hd-note" x="530" y="530" text-anchor="start">(Lanczos。どの辺も縮まなければ upscaler)。解析とプランは入力の寸法のまま。</text>
<text class="hd-note" x="530" y="591" text-anchor="start">256 行の帯を並列に、16 画素のブロックで: g = 拡散面 + h × 幅 + contrast + clarity。</text>
<text class="hd-note" x="530" y="606" text-anchor="start">色の LUT (33³) × 2^g、肩、PQ か SDR + ゲインマップの積算、粒。</text>
<text class="hd-note" x="530" y="667" text-anchor="start">8 / 16bit の行を書き手 (JPEG・JPEG XL・AVIF・HEIF) へ、またはセッションの PQ R&#x27;G&#x27;B&#x27; /</text>
<text class="hd-note" x="530" y="682" text-anchor="start">4:2:0 へ。途中で測った光から MaxCLL / FALL、HDR10+、ST 2094-50。</text>
<text class="hd-note" x="30" y="186" text-anchor="start">破線: 連鎖の後で測り</text>
<text class="hd-note" x="30" y="201" text-anchor="start">直したノイズは走査 C</text>
<text class="hd-note" x="30" y="216" text-anchor="start">のコアリングにも</text>
</svg>
