<g class="hd-k-app">
<rect class="hd-box" x="20" y="40" width="230" height="134" rx="7"/>
<text class="hd-label" x="135.0" y="69.0" text-anchor="middle">アプリ</text>
<text class="hd-sub hd-mono" x="135.0" y="84.0" text-anchor="middle">hdrg_context_register_plugin</text>
<text class="hd-sub hd-mono" x="135.0" y="98.0" text-anchor="middle">hdrg_context_load_plugin</text>
<text class="hd-sub hd-mono" x="135.0" y="112.0" text-anchor="middle">hdrg_context_set_plugin_policy</text>
<text class="hd-sub hd-mono" x="135.0" y="126.0" text-anchor="middle">hdrg_context_add_filter</text>
<text class="hd-sub hd-mono" x="135.0" y="140.0" text-anchor="middle">hdrg_context_set_writer</text>
<text class="hd-sub hd-mono" x="135.0" y="154.0" text-anchor="middle">hdrg_context_set_device</text>
</g>
<g class="hd-k-plugin">
<rect class="hd-box" x="20" y="210" width="230" height="104" rx="7"/>
<text class="hd-label" x="135.0" y="238.0" text-anchor="middle">プラグインのモジュール</text>
<text class="hd-sub hd-mono" x="135.0" y="253.0" text-anchor="middle">HDRG_PLUGIN_DEFINE(init)</text>
<text class="hd-sub hd-mono" x="135.0" y="267.0" text-anchor="middle">hdrg_plugin_abi_version()</text>
<text class="hd-sub hd-mono" x="135.0" y="281.0" text-anchor="middle">hdrg_plugin_init(plugin, api)</text>
<text class="hd-sub hd-mono" x="135.0" y="295.0" text-anchor="middle">(.so / .dylib / .dll)</text>
</g>
<g class="hd-k-filter">
<rect class="hd-box" x="20" y="364" width="230" height="104" rx="7"/>
<text class="hd-label" x="135.0" y="392.0" text-anchor="middle">内蔵のプラグイン</text>
<text class="hd-sub hd-mono" x="135.0" y="407.0" text-anchor="middle">hdrg.deblock · hdrg.mctf ·</text>
<text class="hd-sub hd-mono" x="135.0" y="421.0" text-anchor="middle">hdrg.scale.* · hdrg.stats.* ·</text>
<text class="hd-sub hd-mono" x="135.0" y="435.0" text-anchor="middle">hdrg.jpeg · hdrg.png · hdrg.jxl</text>
<text class="hd-sub hd-mono" x="135.0" y="449.0" text-anchor="middle">… (コンテキストの作成時)</text>
</g>
<g class="hd-k-plugin">
<rect class="hd-box" x="310" y="60" width="340" height="46" rx="7"/>
<text class="hd-label" x="480.0" y="80.0" text-anchor="middle">loader.c</text>
<text class="hd-sub" x="480.0" y="95.0" text-anchor="middle">dlopen / LoadLibrary、ABI の版の照合</text>
</g>
<g class="hd-k-plugin">
<rect class="hd-box" x="310" y="126" width="340" height="66" rx="7"/>
<text class="hd-label" x="480.0" y="149.0" text-anchor="middle">host.c</text>
<text class="hd-sub" x="480.0" y="164.0" text-anchor="middle">入口 → 報告 (情報・ライセンス・</text>
<text class="hd-sub" x="480.0" y="178.0" text-anchor="middle">部品) → 方針 → フリーズ</text>
</g>
<g class="hd-k-plugin">
<rect class="hd-box" x="310" y="212" width="165" height="46" rx="7"/>
<text class="hd-label" x="392.5" y="232.0" text-anchor="middle">validate.c</text>
<text class="hd-sub" x="392.5" y="247.0" text-anchor="middle">UTF-8・ID・SemVer・SPDX</text>
</g>
<g class="hd-k-plugin">
<rect class="hd-box" x="485" y="212" width="165" height="46" rx="7"/>
<text class="hd-label" x="567.5" y="232.0" text-anchor="middle">codec_host.c</text>
<text class="hd-sub" x="567.5" y="247.0" text-anchor="middle">読み手を順に・書き手</text>
</g>
<g class="hd-k-plugin">
<rect class="hd-box" x="310" y="278" width="340" height="66" rx="7"/>
<text class="hd-label" x="480.0" y="301.0" text-anchor="middle">段 (analyzer.c・stats.c)</text>
<text class="hd-sub" x="480.0" y="316.0" text-anchor="middle">PREFILTER ≤ 6 (連鎖)・INTERP 1・SCALE 1</text>
<text class="hd-sub" x="480.0" y="330.0" text-anchor="middle">ANALYZE 1 (光)・STATS 1 (セッション)</text>
</g>
<g class="hd-k-plugin">
<rect class="hd-box" x="310" y="364" width="340" height="96" rx="7"/>
<text class="hd-label" x="480.0" y="395.0" text-anchor="middle">stage.c · format.c</text>
<text class="hd-sub" x="480.0" y="410.0" text-anchor="middle">帯か全画面、RGB16 ↔ ジョブの形式、</text>
<text class="hd-sub" x="480.0" y="424.0" text-anchor="middle">時間のウィンドウとクリップ、飛行中の ASYNC、</text>
<text class="hd-sub" x="480.0" y="438.0" text-anchor="middle">隣り合うフィルタの device のフレーム</text>
</g>
<g class="hd-k-plugin">
<rect class="hd-box" x="720" y="62" width="300" height="78" rx="7"/>
<text class="hd-label" x="870.0" y="91.0" text-anchor="middle">create</text>
<text class="hd-sub" x="870.0" y="106.0" text-anchor="middle">変換・セッションで 1 回: ウィンドウ・クリップ・</text>
<text class="hd-sub" x="870.0" y="120.0" text-anchor="middle">max_inflight・形式を申告</text>
</g>
<g class="hd-k-plugin">
<rect class="hd-box" x="720" y="164" width="300" height="78" rx="7"/>
<text class="hd-label" x="870.0" y="193.0" text-anchor="middle">configure</text>
<text class="hd-sub" x="870.0" y="208.0" text-anchor="middle">フレームごと: 入力・サイドデータ・</text>
<text class="hd-sub" x="870.0" y="222.0" text-anchor="middle">出力の寸法と形式・素通し</text>
</g>
<g class="hd-k-plugin">
<rect class="hd-box" x="720" y="266" width="300" height="78" rx="7"/>
<text class="hd-label" x="870.0" y="295.0" text-anchor="middle">process / submit</text>
<text class="hd-sub" x="870.0" y="310.0" text-anchor="middle">帯かフレームごとのジョブ。</text>
<text class="hd-sub" x="870.0" y="324.0" text-anchor="middle">ASYNC は job_done で終わる</text>
</g>
<g class="hd-k-plugin">
<rect class="hd-box" x="720" y="368" width="300" height="78" rx="7"/>
<text class="hd-label" x="870.0" y="404.0" text-anchor="middle">destroy</text>
<text class="hd-sub" x="870.0" y="419.0" text-anchor="middle">cancel と飛行中のジョブの後</text>
</g>
<text class="hd-note" x="20" y="510" text-anchor="start">文字列は (ポインタ, 長さ) で渡り、検証して複製する。境界を enum は渡らず、ホストのものは中の見えないハンドル。コールバックは最後の引数に API 表を受け取る。</text>
<text class="hd-note" x="20" y="530" text-anchor="start">ABI はフリーズまで版 1 のまま。プラグインは同じ版のヘッダで組み直す。</text>
<text class="hd-note" x="20" y="550" text-anchor="start">サイドデータ: HDRG_SD_NOISE (測った値)・HDRG_SD_MOTION (アプリ・MCTF・INTERP)・HDRG_SD_FILM_GRAIN (コーデックの粒)。</text>
<text class="hd-note" x="20" y="570" text-anchor="start">コーデック (codec.h): 読み手はファイルの頭を試し、ホストが確保した絵へ復号する。書き手は行を帯ごとに受け取り、終わりにゲインマップ・メタデータ・光を受け取る。</text>
</svg>
