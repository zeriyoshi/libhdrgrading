<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" class="hd-svg" role="img" aria-labelledby="plugins-title" lang="ja">
<title id="plugins-title">プラグイン: 登録・段・ジョブ・コーデック</title>
<desc>プラグインは API 表を通して登録し、ホストが検証してフリーズし、段の実行器がフレームごとにフィルタを、コーデックのホストが読み手と書き手を呼ぶ。</desc>
