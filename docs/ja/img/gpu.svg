<rect class="hd-box" x="600" y="50" width="420" height="64" rx="7"/>
<text class="hd-label" x="810.0" y="72.0" text-anchor="middle">生成物 (コミットする)</text>
<text class="hd-sub hd-mono" x="810.0" y="87.0" text-anchor="middle">msl/*.metal · spirv/*.spv · core/hlsl/*.hlsl</text>
<text class="hd-sub hd-mono" x="810.0" y="101.0" text-anchor="middle">(CMake embeds every one as arrays)</text>
</g>
