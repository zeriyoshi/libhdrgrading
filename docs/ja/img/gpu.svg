<text class="hd-sub hd-mono" x="440.0" y="452.0" text-anchor="middle">gk_metal.c</text>
</g>
<g class="hd-k-gpu">
<rect class="hd-box" x="530" y="420" width="160" height="40" rx="7"/>
<text class="hd-label" x="610.0" y="437.0" text-anchor="middle">gpu/vulkan.c</text>
<text class="hd-sub hd-mono" x="610.0" y="452.0" text-anchor="middle">gk_vulkan.c</text>
</g>
<g class="hd-k-gpu">
<rect class="hd-box" x="710" y="360" width="310" height="100" rx="7"/>
<text class="hd-label" x="865.0" y="400.0" text-anchor="middle">gpu/apple.c</text>
<text class="hd-sub" x="865.0" y="415.0" text-anchor="middle">CVPixelBuffer / IOSurface:</text>
<text class="hd-sub" x="865.0" y="429.0" text-anchor="middle">画素の形式と面</text>
</g>
<g class="hd-k-api">
<rect class="hd-box" x="40" y="528" width="300" height="76" rx="7"/>
<text class="hd-label" x="190.0" y="556.0" text-anchor="middle">アプリの device</text>
<text class="hd-sub hd-mono" x="190.0" y="571.0" text-anchor="middle">hdrg_context_set_device</text>
<text class="hd-sub hd-mono" x="190.0" y="585.0" text-anchor="middle">HDRG_DEVICE_METAL / VULKAN / WEBGPU</text>
</g>
<g class="hd-k-gpu">
<rect class="hd-box" x="360" y="528" width="330" height="76" rx="7"/>
<text class="hd-label" x="525.0" y="556.0" text-anchor="middle">ライブラリ自身の device</text>
<text class="hd-sub" x="525.0" y="571.0" text-anchor="middle">最初に使うときに作る。種類ごとに 1 つの</text>
<text class="hd-sub" x="525.0" y="585.0" text-anchor="middle">層をコアとプラグインで共有</text>
</g>
<g class="hd-k-common">
<rect class="hd-box" x="710" y="528" width="310" height="76" rx="7"/>
<text class="hd-label" x="865.0" y="556.0" text-anchor="middle">選ぶ順</text>
<text class="hd-sub" x="865.0" y="571.0" text-anchor="middle">config.device の種類を先に、</text>
<text class="hd-sub" x="865.0" y="585.0" text-anchor="middle">次に Metal → Vulkan → WebGPU → CPU</text>
