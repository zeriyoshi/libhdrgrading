<text class="hd-sub" x="190.0" y="415.0" text-anchor="middle">Dawn。device のスレッドが作業を</text>
<text class="hd-sub" x="190.0" y="429.0" text-anchor="middle">順に実行 (ブラウザはその場 + JSPI)</text>
</g>
<g class="hd-k-gpu">
<rect class="hd-box" x="360" y="360" width="330" height="40" rx="7"/>
<text class="hd-label" x="525.0" y="377.0" text-anchor="middle">gpu/gk.h</text>
