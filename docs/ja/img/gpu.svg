<rect class="hd-box" x="40" y="182" width="300" height="110" rx="7"/>
<text class="hd-label" x="190.0" y="206.0" text-anchor="middle">WebGPU のフィルタ</text>
<text class="hd-sub hd-mono" x="190.0" y="221.0" text-anchor="middle">plugins/*/webgpu_*.c</text>
<text class="hd-sub hd-mono" x="190.0" y="235.0" text-anchor="middle">hdrg.webgpu.deblock · dering ·</text>
<text class="hd-sub hd-mono" x="190.0" y="249.0" text-anchor="middle">defringe · deband · denoise ·</text>
<text class="hd-sub hd-mono" x="190.0" y="263.0" text-anchor="middle">mctf · lanczos · edge · fsr1 ·</text>
<text class="hd-sub hd-mono" x="190.0" y="277.0" text-anchor="middle">nis · interp.mc</text>
</g>
<g class="hd-k-filter">
<rect class="hd-box" x="360" y="182" width="330" height="110" rx="7"/>
<text class="hd-label" x="525.0" y="220.0" text-anchor="middle">Metal と Vulkan のフィルタ</text>
<text class="hd-sub hd-mono" x="525.0" y="235.0" text-anchor="middle">plugins/*/gk_*.c (written once)</text>
<text class="hd-sub hd-mono" x="525.0" y="249.0" text-anchor="middle">hdrg.metal.* · hdrg.vulkan.*</text>
<text class="hd-sub hd-mono" x="525.0" y="263.0" text-anchor="middle">+ plugins/metalfx (MetalFX)</text>
</g>
<g class="hd-k-gpu">
<rect class="hd-box" x="710" y="182" width="310" height="110" rx="7"/>
<text class="hd-label" x="865.0" y="213.0" text-anchor="middle">コアの GPU の層</text>
<text class="hd-sub hd-mono" x="865.0" y="228.0" text-anchor="middle">core/gpu_core.c: 40 buffer slots</text>
<text class="hd-sub hd-mono" x="865.0" y="242.0" text-anchor="middle">gpu_convert: Y&#x27;CbCr → RGB16</text>
<text class="hd-sub hd-mono" x="865.0" y="256.0" text-anchor="middle">gpu_apply: pass C</text>
<text class="hd-sub hd-mono" x="865.0" y="270.0" text-anchor="middle">gpu_analyze · gpu_gather</text>
</g>
<g class="hd-k-gpu">
<rect class="hd-box" x="40" y="360" width="300" height="100" rx="7"/>
