<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" class="hd-svg" role="img" aria-labelledby="gpu-title" lang="ja">
<title id="gpu-title">GPU の層: シェーダ・下位層・フィルタ・コア</title>
<desc>シェーダのリファレンスは WGSL で、Tint が MSL と SPIR-V を作る。フィルタとコアは WebGPU か、Metal と Vulkan の共通の層の上で 1 回だけ書く。</desc>
