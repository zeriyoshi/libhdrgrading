<text class="hd-sub hd-mono" x="165.0" y="94.0" text-anchor="middle">plugins/*/wgsl · core/wgsl</text>
</g>
<g class="hd-k-common">
<rect class="hd-box" x="330" y="50" width="230" height="64" rx="7"/>
<text class="hd-label" x="445.0" y="79.0" text-anchor="middle">scripts/gen_shaders.sh</text>
<text class="hd-sub" x="445.0" y="94.0" text-anchor="middle">Tint の CLI (build_dawn.sh --tint)</text>
</g>
