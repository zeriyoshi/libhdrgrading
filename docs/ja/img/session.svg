<text class="hd-note" x="40" y="420" text-anchor="start">遅延 (hdrg_session_latency) = 統計のウィンドウの未来 + フィルタの時間のウィンドウの未来 + 飛行中の ASYNC。LOW はジョブを 1 つずつ待つ。</text>
<text class="hd-note" x="40" y="440" text-anchor="start">シーク: start = n − p、preroll = p (hdrg_session_preroll) で、フレーム n からが頭から通したセッションとバイト一致 (WINDOWED・TWO_PASS・STATIC)。</text>
<text class="hd-note" x="40" y="460" text-anchor="start">GPU に置く経路 (HDRG_GPU_AUTO・Y&#x27;CbCr の入力・ライブラリの GPU のフィルタだけ・SCALE なし): 取り込みから適用まで device に置き、解析は縮小画とノイズのウィンドウだけを読み戻す。</text>
<text class="hd-note" x="40" y="480" text-anchor="start">受け取りごとに late (レートに遅れた)・shed・synthetic / phase (出力のレート)・動きの場も返す。hdrg_session_latency_report が直すところを勧める。</text>
<text class="hd-note" x="40" y="510" text-anchor="start">セッションは 1 度に 1 つのスレッドから: HDRG_ERR_AGAIN まで送り、HDRG_ERR_AGAIN まで受け取り、…。終わりに NULL を送り、HDRG_EOF まで受け取る。</text>
