<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 250" width="1040" height="250" class="hd-svg" role="img" aria-labelledby="window-title" lang="ja">
<title id="window-title">セッションのウィンドウ: 過去・未来・遅延・preroll</title>
<desc>フレーム t はシーンの [t − past, t + future] のフレームから描かれ、t + future を送った後に出てくる。</desc>
