<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" width="1040" height="800" class="hd-svg" role="img" aria-labelledby="layers-title" lang="ja">
<title id="layers-title">libhdrgrading のライブラリの層</title>
<desc>呼び出す側は公開ヘッダを使い、入口が pipeline を動かし、pipeline がコアとプラグインのホストを使う。静止画は容器と I/O の層を通して書く。すべての下に共通の層と同梱の依存がある。</desc>
